<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавление — {{ forecast.title }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="draft-body">

    <header class="catalog-header">
        <span class="home-link">AM Forecast</span>
    </header>

    <main class="draft-form-wrapper">
        <div class="draft-card">
            <div class="draft-card-title">Новый прогноз</div>

            <div class="draft-field">
                <label for="target_period">Период:</label>
                <input type="text" id="target_period" value="{{ forecast.target_period }}">
            </div>

            <div class="draft-field">
                <label for="window_count">Количество периодов (3/6/12):</label>
                <input type="text" id="window_count" value="{{ forecast.window_count if forecast.window_count is not none else '' }}">
            </div>

            <div class="draft-field">
                <label for="window_unit">Тип периодов:</label>
                <input type="text" id="window_unit" value="{{ forecast.window_unit if forecast.window_unit is not none else '' }}">
            </div>

            <div class="draft-field">
                <label for="predicted_revenue">Прогноз выручки:</label>
                <input type="text" id="predicted_revenue" value="{{ predicted_revenue if predicted_revenue is not none else '' }}" readonly>
            </div>

            <div class="draft-field">
                <label for="description">Описание:</label>
                <textarea id="description">{{ forecast.description }}</textarea>
            </div>

            <div class="draft-media-row">
                <div class="draft-media-block">
                    <label>Изображение:</label>
                    <label class="draft-media-dropzone">
                        <input type="file" accept="image/*">
                        {% if forecast.image_url %}
                            <img src="{{ forecast.image_url }}" alt="Изображение">
                        {% else %}
                            <span class="draft-media-plus">+</span>
                        {% endif %}
                    </label>
                </div>
                <div class="draft-media-block">
                    <label>Видео:</label>
                    <label class="draft-media-dropzone">
                        <input type="file" accept="video/*">
                        {% if forecast.video_url %}
                            <img src="{{ forecast.image_url }}" alt="Превью видео">
                        {% else %}
                            <span class="draft-media-plus">+</span>
                        {% endif %}
                    </label>
                </div>
            </div>
        </div>
    </main>

    <nav class="tab-bar">
        <a href="/forecast/1" class="tab-item">Лента</a>
        <a href="/draft" class="tab-item tab-active">Добавление</a>
        <a href="/" class="tab-item">Список</a>
    </nav>

</body>
</html>
