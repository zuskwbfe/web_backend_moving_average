<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ period.title }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="detail-page-body">

    <header class="detail-header">
        <a href="/" class="home-link">AM Forecast</a>
    </header>

    <main class="video-layout">
        <div class="tiktok-container">
            <video autoplay loop muted playsinline>
                <source src="{{ video_url }}" type="video/mp4">
            </video>

            <!-- Параметры — справа, текст выровнен по правому краю -->
            <div class="side-fields">
                <span class="theme-field">Порядок: {{ period.order_number }}</span>
                <span class="theme-field">{{ days_label }}</span>
            </div>

            <!-- Иконки — отдельно, зафиксированы на постоянном месте -->
            <div class="side-icons">
                <div class="like-button">
                    <img src="/static/img/like.png" alt="Лайк" class="like-icon">
                    <span class="like-count">{{ likes_count }}</span>
                </div>

                <a href="/period/{{ period.id }}?next=true" class="next-button">
                    <img src="/static/img/next.png" alt="Следующий">
                </a>
            </div>

            <!-- Название и описание — снизу поверх видео -->
            <div class="description-overlay">
                <strong>{{ period.title }}</strong>

                <input type="checkbox" id="desc-toggle-{{ period.id }}" class="desc-toggle-checkbox">
                <p class="description-text">{{ period.description }}</p>
                <label for="desc-toggle-{{ period.id }}" class="desc-toggle-label">
                    <span class="label-more">больше</span>
                    <span class="label-less">меньше</span>
                </label>
            </div>
        </div>
    </main>

    <nav class="tab-bar">
        <a href="/period/{{ period.id }}" class="tab-item tab-active">Лента</a>
        <a href="/draft" class="tab-item">Добавление</a>
        <a href="/" class="tab-item">Список</a>
    </nav>

</body>
</html>
