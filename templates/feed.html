<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ forecast.title }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="detail-page-body">

    <header class="detail-header">
        <a href="/" class="home-link">AM Forecast</a>
    </header>

    <main class="video-layout">
        <div class="tiktok-container">
            <video autoplay loop muted playsinline>
                <source src="{{ forecast.video_url }}" type="video/mp4">
            </video>

            <div class="description-overlay">
                <strong>{{ forecast.title }}</strong>

                <div class="theme-fields">
                    <span class="theme-field">Период: {{ forecast.target_period }}</span>
                    <span class="theme-field theme-field-highlight">Прогноз: {{ predicted_revenue }} млрд ₽</span>
                </div>

                <input type="checkbox" id="desc-toggle-{{ forecast.id }}" class="desc-toggle-checkbox">
                <p class="description-text">{{ forecast.description }}</p>
                <label for="desc-toggle-{{ forecast.id }}" class="desc-toggle-label">
                    <span class="label-more">больше</span>
                    <span class="label-less">меньше</span>
                </label>

                <div class="overlay-bottom-row">
                    <div class="like-button">
                        <img src="http://localhost:9000/forecasts/like.png" alt="Лайк" class="like-icon">
                        <span class="like-count">{{ likes_count }}</span>
                    </div>
                    <a href="/forecast/{{ forecast.id }}?next=true" class="next-button">
                        <img src="http://localhost:9000/forecasts/next.png" alt="Следующий">
                    </a>
                </div>
            </div>
        </div>
    </main>

    <nav class="tab-bar">
        <a href="/forecast/{{ forecast.id }}" class="tab-item tab-active">Лента</a>
        <a href="/draft" class="tab-item">Добавление</a>
        <a href="/" class="tab-item">Список</a>
    </nav>

</body>
</html>
