<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог периодов</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="catalog-body">

    <header class="catalog-header">
        <span class="home-link">AM Forecast</span>
    </header>

    <div class="filter-bar-wrapper">
        <form method="get" action="/" class="filter-bar">
            <input
                type="range"
                name="min_days"
                class="filter-slider"
                min="0"
                max="100"
                step="1"
                value="{{ min_days if min_days else 0 }}"
            >
            <button type="submit" class="filter-button">Найти</button>
        </form>
    </div>

    <div class="filter-current-value">Минимальное количество дней: {{ min_days if min_days else 0 }}</div>

    <div class="tile-grid">
        {% for period in periods %}
        <div class="tile-card-wrapper">
            <a href="/period/{{ period.id }}" class="tile-card">
                <img src="{{ period.image_url }}" alt="{{ period.title }}" class="tile-image">
                <div class="tile-info">
                    <div class="tile-title">{{ period.title }}</div>
                    <div class="tile-revenue">{{ period.days_label }}</div>
                    <div class="tile-likes">
                        <img src="/static/img/like.png" alt="Лайк">
                        <span>{{ period.likes_count }}</span>
                    </div>
                </div>
            </a>
            <form action="/period/{{ period.id }}/delete" method="post" class="tile-delete-form">
                <button type="submit" class="tile-delete-btn">Удалить</button>
            </form>
        </div>
        {% endfor %}
    </div>

    <nav class="tab-bar">
        <a href="/period/1" class="tab-item">Лента</a>
        <a href="/draft" class="tab-item">Добавление</a>
        <a href="/" class="tab-item tab-active">Список</a>
    </nav>

</body>
</html>
