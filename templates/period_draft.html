<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавление</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="draft-body">

    <header class="catalog-header">
        <span class="home-link">AM Forecast</span>
    </header>

    <main class="draft-form-wrapper">
        <div class="draft-card">

            {% if period is none %}
            <div class="draft-card-title">Новый период</div>

            <form action="/draft/create" method="post">
                <div class="draft-field">
                    <label for="title">Название:</label>
                    <input type="text" id="title" name="title" required>
                </div>

                <div class="draft-media-row">
                    <div class="draft-media-block">
                        <label>Изображение:</label>
                        <label class="draft-media-dropzone">
                            <input type="file" accept="image/*">
                            <span class="draft-media-plus">+</span>
                        </label>
                    </div>
                    <div class="draft-media-block">
                        <label>Видео:</label>
                        <label class="draft-media-dropzone">
                            <input type="file" accept="video/*">
                            <span class="draft-media-plus">+</span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="draft-submit-btn">Далее</button>
            </form>

            {% else %}
            <div class="draft-card-title">Публикация периода «{{ period.title }}»</div>

            <div class="draft-media-row">
                <div class="draft-media-block">
                    <label>Изображение:</label>
                    <div class="draft-media-dropzone">
                        <img src="{{ image_url }}" alt="Изображение">
                    </div>
                </div>
                <div class="draft-media-block">
                    <label>Видео:</label>
                    <div class="draft-media-dropzone">
                        <img src="{{ image_url }}" alt="Превью видео">
                    </div>
                </div>
            </div>

            <form action="/draft/publish" method="post">
                <div class="draft-field">
                    <label for="order_number">Порядок:</label>
                    <input type="number" id="order_number" name="order_number" required>
                </div>

                <div class="draft-field">
                    <label for="days_count">Количество дней:</label>
                    <input type="number" id="days_count" name="days_count" required>
                </div>

                <div class="draft-field">
                    <label for="description">Краткое описание:</label>
                    <textarea id="description" name="description" required></textarea>
                </div>

                <button type="submit" class="draft-submit-btn">Опубликовать</button>
            </form>
            {% endif %}

        </div>
    </main>

    <nav class="tab-bar">
        <a href="/period/1" class="tab-item">Лента</a>
        <a href="/draft" class="tab-item tab-active">Добавление</a>
        <a href="/" class="tab-item">Список</a>
    </nav>

</body>
</html>
